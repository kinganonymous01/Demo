<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Burst • Browser Use Runner</title>
  <style>
    :root {
      --bg1: #0f172a;
      --bg2: #1e1b4b;
      --card: rgba(15, 23, 42, 0.72);
      --line: rgba(148, 163, 184, 0.2);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #22d3ee;
      --accent-2: #a78bfa;
      --ok: #34d399;
      --warn: #f59e0b;
      --error: #f43f5e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 10% 10%, #1d4ed8 0%, transparent 35%),
                  radial-gradient(circle at 90% 90%, #7c3aed 0%, transparent 40%),
                  linear-gradient(135deg, var(--bg1), var(--bg2));
      padding: 20px;
    }

    .app {
      max-width: 980px;
      margin: 0 auto;
      backdrop-filter: blur(6px);
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 20px 35px rgba(0,0,0,0.28);
    }

    h1 { margin: 0 0 8px; font-size: 1.8rem; }
    .sub { margin: 0 0 20px; color: var(--muted); }

    .task-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .task-input {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(15,23,42,0.45);
      color: var(--text);
      border-radius: 12px;
      padding: 12px 14px;
      outline: none;
    }

    .task-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(34, 211, 238, 0.2);
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 11px 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }

    button:hover { transform: translateY(-1px); }
    button:disabled { opacity: .45; cursor: not-allowed; transform: none; }

    #addTask { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #0b1023; }
    #runTasks { background: linear-gradient(135deg, #34d399, #22c55e); color: #052e16; }

    .hint { color: var(--muted); margin: 12px 0 0; font-size: .92rem; }
    .status { margin-top: 12px; font-weight: 700; }

    .grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      margin-top: 18px;
    }

    .result {
      background: rgba(2, 6, 23, 0.65);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      min-height: 220px;
    }

    .result h3 { margin: 0 0 8px; font-size: 1rem; }
    .result .meta { color: var(--muted); font-size: .85rem; margin-bottom: 8px; }
    pre {
      margin: 0;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: .9rem;
      line-height: 1.35;
      color: #c7d2fe;
    }

    @media (max-width: 640px) {
      body { padding: 12px; }
      .panel { padding: 16px; }
      h1 { font-size: 1.35rem; }
      button { flex: 1 1 auto; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="panel">
      <h1>⚡ Task Burst</h1>
      <p class="sub">Add up to <strong>3 tasks</strong>. Nothing is sent to Browser Use until you hit <strong>Run All</strong>. Then all tasks run in parallel.</p>

      <div id="taskContainer"></div>

      <div class="actions">
        <button id="addTask" type="button">＋ Add Task</button>
        <button id="runTasks" type="button">▶ Run All</button>
      </div>

      <p class="hint">Tip: keep tasks clear and specific for best Browser Use results.</p>
      <div id="status" class="status" aria-live="polite"></div>

      <div id="results" class="grid"></div>
    </section>
  </main>

  <script>
    const API_KEY = 'bu_S93lJ_DddZ9arzgCZtWqHg3E0Sjjjjqc47Rr81fW1A8';
    const API_URL = 'https://api.browser-use.com/api/v1/run-task';
    const MAX_TASKS = 3;

    const taskContainer = document.getElementById('taskContainer');
    const addTaskBtn = document.getElementById('addTask');
    const runTasksBtn = document.getElementById('runTasks');
    const statusEl = document.getElementById('status');
    const resultsEl = document.getElementById('results');

    const createTaskInput = (idx) => {
      const row = document.createElement('div');
      row.className = 'task-row';
      row.innerHTML = `<input class="task-input" placeholder="Task ${idx + 1}: e.g. Find latest MacBook Air price on Apple.com" />`;
      taskContainer.appendChild(row);
    };

    const getTaskInputs = () => Array.from(document.querySelectorAll('.task-input'));

    const refreshAddState = () => {
      addTaskBtn.disabled = getTaskInputs().length >= MAX_TASKS;
    };

    const setStatus = (message, color = 'var(--text)') => {
      statusEl.textContent = message;
      statusEl.style.color = color;
    };

    const renderResultBox = (index, taskText) => {
      const card = document.createElement('article');
      card.className = 'result';
      card.id = `result-${index}`;
      card.innerHTML = `
        <h3>Task ${index + 1}</h3>
        <div class="meta">${taskText}</div>
        <pre>Waiting to run...</pre>
      `;
      resultsEl.appendChild(card);
      return card.querySelector('pre');
    };

    const extractText = (data) => {
      if (!data) return 'No response body.';
      if (typeof data === 'string') return data;
      if (data.result) return typeof data.result === 'string' ? data.result : JSON.stringify(data.result, null, 2);
      return JSON.stringify(data, null, 2);
    };

    const runSingleTask = async (task) => {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${API_KEY}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ task })
      });

      const body = await res.json().catch(() => null);
      if (!res.ok) {
        throw new Error((body && (body.message || body.error)) || `HTTP ${res.status}`);
      }
      return body;
    };

    addTaskBtn.addEventListener('click', () => {
      const currentCount = getTaskInputs().length;
      if (currentCount < MAX_TASKS) {
        createTaskInput(currentCount);
        refreshAddState();
      }
    });

    runTasksBtn.addEventListener('click', async () => {
      const tasks = getTaskInputs().map(i => i.value.trim()).filter(Boolean);
      if (!tasks.length) {
        setStatus('Please add at least one task before running.', 'var(--warn)');
        return;
      }

      resultsEl.innerHTML = '';
      const outputs = tasks.map((task, i) => renderResultBox(i, task));

      runTasksBtn.disabled = true;
      addTaskBtn.disabled = true;
      setStatus(`Running ${tasks.length} task(s) in parallel...`, 'var(--accent)');

      const promises = tasks.map((task, i) =>
        runSingleTask(task)
          .then((data) => {
            outputs[i].textContent = extractText(data);
            return { ok: true };
          })
          .catch((err) => {
            outputs[i].textContent = `Error: ${err.message}`;
            return { ok: false };
          })
      );

      const results = await Promise.all(promises);
      const successCount = results.filter(r => r.ok).length;

      if (successCount === tasks.length) {
        setStatus(`Done. ${successCount}/${tasks.length} tasks completed.`, 'var(--ok)');
      } else {
        setStatus(`Completed with some errors. ${successCount}/${tasks.length} succeeded.`, 'var(--error)');
      }

      runTasksBtn.disabled = false;
      refreshAddState();
    });

    createTaskInput(0);
    refreshAddState();
  </script>
</body>
</html>
